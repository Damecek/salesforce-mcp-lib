name: CI

# npm proxy only. Apex validation needs a Dev Hub or scratch org login and is not run here;
# see "Contributing" in README.md for the manual Apex validation steps.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: packages/salesforce-mcp-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/salesforce-mcp-lib/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
